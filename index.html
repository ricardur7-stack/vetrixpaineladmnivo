<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vetrix Admin | Mobile</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0a0a0b;
            --card-bg: #141417;
            --border-gray: #232326;
            --accent-cyan: #00f2ff;
            --text-high: #ffffff;
            --text-low: #80808a;
            --danger: #ff3355;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-body);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- LOGIN (FULLSCREEN MOBILE) --- */
        #loginPanel {
            position: fixed; inset: 0; background: var(--bg-body);
            z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid var(--border-gray);
            width: 100%; max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- HEADER MOBILE --- */
        .mobile-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: var(--card-bg); border-bottom: 1px solid var(--border-gray);
            position: sticky; top: 0; z-index: 900;
        }
        .mobile-header h2 { font-size: 18px; letter-spacing: 2px; font-weight: 600; }
        .mobile-header h2 span { color: var(--accent-cyan); }

        /* --- NAVIGATION (BOTTOM BAR ON MOBILE) --- */
        .sidebar {
            background: #111114;
            border-top: 1px solid var(--border-gray);
            display: flex; flex-direction: row;
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: 70px; z-index: 999; justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .menu-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-low); flex: 1; font-size: 10px; gap: 5px; transition: 0.3s;
        }
        .menu-item i { font-size: 20px; }
        .menu-item.active { color: var(--accent-cyan); }

        /* --- CONTENT AREA --- */
        .main { 
            flex: 1; padding: 20px; padding-bottom: 100px; 
            max-width: 1000px; margin: 0 auto; width: 100%;
        }

        /* STATS CARDS */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px;
        }
        .stat-card {
            background: var(--card-bg); padding: 15px; border-radius: 16px;
            border: 1px solid var(--border-gray);
        }
        .stat-card i { color: var(--accent-cyan); font-size: 14px; margin-bottom: 8px; }
        .stat-card span { display: block; color: var(--text-low); font-size: 11px; text-transform: uppercase; }
        .stat-card h3 { font-size: 20px; margin-top: 4px; font-family: 'JetBrains Mono'; }

        /* BOXES & FORMS */
        .glass-box {
            background: var(--card-bg); border-radius: 18px;
            border: 1px solid var(--border-gray); padding: 20px; margin-bottom: 20px;
        }
        .box-title { 
            font-size: 14px; font-weight: 600; margin-bottom: 18px; 
            display: flex; align-items: center; gap: 10px; color: var(--text-low);
        }

        input {
            width: 100%; background: #08080a; border: 1px solid var(--border-gray);
            padding: 14px; border-radius: 12px; color: #fff; margin-bottom: 12px;
            font-size: 14px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent-cyan); }

        button {
            width: 100%; background: var(--accent-cyan); color: #000;
            border: none; padding: 14px; border-radius: 12px; font-weight: 700;
            text-transform: uppercase; font-size: 12px; letter-spacing: 1px; transition: 0.3s;
        }
        button:active { transform: scale(0.98); opacity: 0.8; }
        button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* TABLES (SCROLLABLE ON MOBILE) */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { text-align: left; font-size: 11px; color: var(--text-low); padding: 12px 8px; border-bottom: 1px solid var(--border-gray); }
        td { padding: 14px 8px; font-size: 13px; border-bottom: 1px solid #1a1a1d; }
        
        .key-code { font-family: 'JetBrains Mono'; color: var(--accent-cyan); font-weight: 500; }

        .hidden { display: none !important; }

        /* AJUSTE PARA DESKTOP */
        @media (min-width: 800px) {
            .sidebar { width: 250px; height: 100vh; flex-direction: column; left: 0; bottom: auto; border-top: none; border-right: 1px solid var(--border-gray); padding: 40px 20px; }
            .menu-item { flex-direction: row; justify-content: flex-start; padding: 15px; font-size: 14px; flex: none; border-radius: 12px; }
            .main { margin-left: 250px; }
            .mobile-header { display: none; }
        }
    </style>
</head>
<body>

    <div id="loginPanel">
        <div class="login-card">
            <i class="fa-solid fa-vetrix" style="font-size: 40px; color: var(--accent-cyan); margin-bottom: 20px;"></i>
            <h2 style="letter-spacing: 3px;">VETRIX <span>ADMIN</span></h2>
            <p style="color: var(--text-low); font-size: 13px; margin: 10px 0 30px;">Painel de Controle Corporativo</p>
            <input type="text" id="loginUser" placeholder="Usuário">
            <input type="password" id="loginPass" placeholder="Senha">
            <button onclick="login()">Entrar no Sistema</button>
            <p id="loginMsg" style="color: var(--danger); font-size: 12px; margin-top: 15px;"></p>
        </div>
    </div>

    <header class="mobile-header hidden" id="mobHead">
        <h2>VETRIX<span>.</span></h2>
        <i class="fa-solid fa-bolt" style="color: var(--accent-cyan);"></i>
    </header>

    <nav class="sidebar hidden" id="sidebar">
        <div class="menu-item active" onclick="switchTab('keysTab')">
            <i class="fa-solid fa-code-merge"></i> <span>Licenças</span>
        </div>
        <div class="menu-item" id="btnReseller" onclick="switchTab('resellerTab')">
            <i class="fa-solid fa-users-gear"></i> <span>Parceiros</span>
        </div>
        <div class="menu-item" onclick="location.reload()">
            <i class="fa-solid fa-right-from-bracket"></i> <span>Sair</span>
        </div>
    </nav>

    <main class="main hidden" id="mainDashboard">
        
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-wallet"></i>
                <span>Créditos</span>
                <h3 id="displayCredit">--</h3>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-key"></i>
                <span>Ativas</span>
                <h3 id="totalKeys">0</h3>
            </div>
        </div>

        <div id="keysTab" class="tab-content">
            <div class="glass-box">
                <div class="box-title"><i class="fa-solid fa-plus-circle"></i> Gerar Licenças</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input type="number" id="keyCount" placeholder="Quantas?">
                    <input type="number" id="keyDays" placeholder="Dias">
                </div>
                <button onclick="generateKey()">Emitir Keys</button>
                <p id="keyMsg" style="text-align: center; font-size: 12px; margin-top: 10px; color: var(--accent-cyan);"></p>
            </div>

            <div class="glass-box">
                <div class="box-title"><i class="fa-solid fa-list-ul"></i> Base de Dados</div>
                <div class="table-container">
                    <table id="keysTable">
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Origem</th>
                                <th>Expira</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="resellerTab" class="tab-content hidden">
            <div class="glass-box">
                <div class="box-title"><i class="fa-solid fa-user-plus"></i> Novo Revendedor</div>
                <input type="text" id="resUser" placeholder="Login">
                <input type="password" id="resPass" placeholder="Senha">
                <input type="number" id="resCredit" placeholder="Créditos">
                <button onclick="addReseller()">Cadastrar</button>
            </div>

            <div class="glass-box">
                <div class="box-title"><i class="fa-solid fa-network-wired"></i> Gerenciar</div>
                <div class="table-container">
                    <table id="resellerTable">
                        <thead>
                            <tr>
                                <th>Login</th>
                                <th>Créditos</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlug6Fm9HjfWaaMOUHGNJVHpW97BvBF-g",
            authDomain: "vetrix7-1d0cd.firebaseapp.com",
            databaseURL: "https://vetrix7-1d0cd-default-rtdb.firebaseio.com",
            projectId: "vetrix7-1d0cd",
            storageBucket: "vetrix7-1d0cd.firebasestorage.app",
            messagingSenderId: "780650294762",
            appId: "1:1041708851083:android:6b58c58c6681a516b0d98e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentResellerID = null;
        let loggedUser = "";

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function login() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            if (user === 'vetrix' && pass === 'cheats7') {
                loggedUser = "vetrix";
                showDashboard(false);
                return;
            }

            db.ref('resellers').once('value', snap => {
                let found = false;
                snap.forEach(s => {
                    const r = s.val();
                    if (r.login === user && r.pass === pass) {
                        found = true;
                        currentResellerID = s.key;
                        loggedUser = r.login;
                        showDashboard(true);
                    }
                });
                if(!found) document.getElementById('loginMsg').innerText = "Acesso Negado.";
            });
        }

        function showDashboard(isReseller) {
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('mobHead').classList.remove('hidden');
            if(isReseller) document.getElementById('btnReseller').classList.add('hidden');
            
            loadKeys(isReseller);
            updateCreditDisplay();
            if(!isReseller) loadResellers();
        }

        function generateKey() {
            const count = parseInt(document.getElementById('keyCount').value);
            const days = parseInt(document.getElementById('keyDays').value);
            if(!count || !days) return alert("Preencha os campos!");

            if (currentResellerID) {
                db.ref('resellers/' + currentResellerID).once('value', snap => {
                    const cred = snap.val().credit || 0;
                    if (cred < count) return alert("Saldo insuficiente!");
                    db.ref('resellers/' + currentResellerID + '/credit').set(cred - count)
                    .then(() => pushKeys(days, count));
                });
            } else {
                pushKeys(days, count);
            }
        }

        function pushKeys(days, count) {
            for (let i = 0; i < count; i++) {
                const key = 'VETRIX-' + Math.random().toString(36).substr(2, 8).toUpperCase();
                const d = new Date();
                d.setDate(d.getDate() + days);
                db.ref('keys').push({
                    key, 
                    user: loggedUser, 
                    expiresAt: d.toISOString(),
                    resellerID: currentResellerID || 'ADMIN'
                });
            }
            document.getElementById('keyMsg').innerText = "Sucesso!";
            setTimeout(() => { document.getElementById('keyMsg').innerText = ""; }, 2000);
        }

        function loadKeys(onlyMine) {
            db.ref('keys').on('value', snap => {
                const tbody = document.querySelector('#keysTable tbody');
                tbody.innerHTML = '';
                let total = 0;
                snap.forEach(s => {
                    const k = s.val();
                    if (onlyMine && k.resellerID !== currentResellerID) return;
                    total++;
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td class="key-code">${k.key}</td>
                        <td style="color:#aaa">${k.user}</td>
                        <td>${new Date(k.expiresAt).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}</td>
                        <td><i class="fa-solid fa-trash" style="color:var(--danger)" onclick="deleteKey('${s.key}')"></i></td>
                    `;
                });
                document.getElementById('totalKeys').innerText = total;
            });
        }

        function deleteKey(id) { if(confirm("Revogar key?")) db.ref('keys/' + id).remove(); }

        function updateCreditDisplay() {
            if (currentResellerID) {
                db.ref('resellers/' + currentResellerID + '/credit').on('value', snap => {
                    document.getElementById('displayCredit').innerText = snap.val() || 0;
                });
            } else {
                document.getElementById('displayCredit').innerText = "INF";
            }
        }

        function addReseller() {
            const login = document.getElementById('resUser').value;
            const pass = document.getElementById('resPass').value;
            const credit = parseInt(document.getElementById('resCredit').value);
            if(login && pass) {
                db.ref('resellers').push({ login, pass, credit, banned: false });
                alert("Revendedor Adicionado!");
            }
        }

        function loadResellers() {
            db.ref('resellers').on('value', snap => {
                const tbody = document.querySelector('#resellerTable tbody');
                tbody.innerHTML = '';
                snap.forEach(s => {
                    const r = s.val();
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${r.login}</td>
                        <td>${r.credit}</td>
                        <td><i class="fa-solid fa-user-minus" style="color:var(--danger)" onclick="db.ref('resellers/${s.key}').remove()"></i></td>
                    `;
                });
            });
        }
    </script>
</body>
</html>
